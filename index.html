<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panic City — a whole city of games for kids</title>
<meta name="description" content="">
<meta property="og:title" content="Panic City"><meta property="og:image" content="https://paniccity.online/img/poster-en.jpg"><meta property="og:url" content="https://paniccity.online/"><meta property="og:type" content="website">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--sky:#4cc3ff;--navy:#16295c;--yel:#ffd23f;--cor:#ff6b57;--bg:#f4fbff;--ink:#1d2b4f;--mut:#5b6b8c}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;overflow-x:hidden}
img,video{max-width:100%;display:block}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid #e3eef7}
.bar{display:flex;align-items:center;gap:14px;height:62px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;text-decoration:none;color:var(--navy)}
.logo{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}.logo img{width:34px;height:34px;border-radius:9px}
nav{display:flex;gap:18px;margin-left:18px}
nav a{text-decoration:none;font-weight:600;font-size:14px;color:var(--mut)}
nav a:hover{color:var(--navy)}
.sp{flex:1}
select{font:600 14px Poppins,sans-serif;padding:7px 10px;border-radius:10px;border:2px solid #d7e6f2;background:#fff;color:var(--navy)}
.btn{display:inline-block;border:0;cursor:pointer;font:800 16px Poppins,sans-serif;color:#fff;background:var(--cor);padding:14px 26px;border-radius:999px;text-decoration:none;box-shadow:0 6px 0 #d94b39;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d94b39}
.btn.sm{padding:9px 18px;font-size:14px;box-shadow:0 4px 0 #d94b39}
.btn.ghost{background:#fff;color:var(--navy);box-shadow:0 6px 0 #cfe0ee}
.hero{background:linear-gradient(180deg,#bfe9ff 0%,#eaf8ff 70%,var(--bg) 100%);padding:56px 0 40px;position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:center}
.kick{display:inline-block;background:var(--yel);color:var(--navy);font-weight:700;font-size:13px;padding:5px 14px;border-radius:999px;margin-bottom:14px}
h1{font-size:clamp(34px,5vw,56px);line-height:1.08;font-weight:800;color:var(--navy)}
h1 span{color:var(--cor)}
.hero p.lead{font-size:18px;color:var(--mut);margin:16px 0 20px;max-width:520px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chips b{background:#fff;border:2px solid #d7e6f2;border-radius:999px;padding:5px 13px;font-size:13px;color:var(--navy)}
.chips b::before{content:"✓ ";color:#27b36a}
.ctas{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.note{font-size:13px;color:var(--mut);margin-top:14px}
.tablet{position:relative;background:#0f1a3d;border-radius:28px;padding:12px;box-shadow:0 30px 60px rgba(22,41,92,.28);transform:rotate(2deg)}
.tablet #heroShot{border-radius:18px;width:100%}
.hz{position:absolute;width:88px;filter:drop-shadow(0 8px 8px rgba(0,0,0,.25));animation:fl 4s ease-in-out infinite}
.hz.a{left:-34px;bottom:-24px}.hz.b{right:-26px;top:-30px;animation-delay:-2s}
@keyframes fl{50%{transform:translateY(-10px)}}
section{padding:60px 0}
h2{font-size:clamp(26px,3.6vw,38px);font-weight:800;color:var(--navy);text-align:center}
.sub{text-align:center;color:var(--mut);max-width:620px;margin:8px auto 34px}
.vid{max-width:860px;margin:0 auto;border-radius:22px;overflow:hidden;box-shadow:0 20px 50px rgba(22,41,92,.25);background:#000}
.vid video{width:100%;aspect-ratio:16/9}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 24px rgba(22,41,92,.08);border:2px solid #e6f1f9}
.card .em{font-size:34px}
.card h3{font-size:19px;margin:8px 0 6px;color:var(--navy)}
.card p{color:var(--mut);font-size:15px}
.gal{background:#fff}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 20px}
.rail figure{flex:0 0 min(380px,78vw);scroll-snap-align:center;background:var(--bg);border-radius:20px;overflow:hidden;border:2px solid #e6f1f9}
.rail figcaption{padding:10px 14px;font-weight:700;color:var(--navy)}
.heroes{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px}
.heroes img{width:92px;height:92px;object-fit:contain}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:s;margin-bottom:34px}
.steps .card{position:relative;padding-top:42px}
.steps .card::before{counter-increment:s;content:counter(s);position:absolute;top:-16px;left:22px;width:38px;height:38px;border-radius:50%;background:var(--yel);color:var(--navy);font-weight:800;display:grid;place-items:center;font-size:18px}
.tabs{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{font:700 14px Poppins,sans-serif;padding:9px 18px;border-radius:999px;border:2px solid #d7e6f2;background:#fff;color:var(--navy);cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabbody{max-width:560px;margin:0 auto;background:#fff;border-radius:20px;padding:18px 26px;border:2px solid #e6f1f9}
.tabbody ol{padding-left:22px}.tabbody li{padding:5px 0}
.inst{text-align:center;margin-top:18px}
details{background:#fff;border:2px solid #e6f1f9;border-radius:16px;padding:14px 18px;max-width:780px;margin:0 auto 10px}
summary{cursor:pointer;font-weight:700;color:var(--navy)}
details p{color:var(--mut);margin-top:8px}
.final{background:var(--navy);color:#fff;text-align:center}
.final h2{color:#fff}.final .sub{color:#c9d6f5}
.price{font-size:54px;font-weight:800;color:var(--yel);margin:6px 0 18px}
footer{padding:24px 0;text-align:center;font-size:13px;color:var(--mut)}
.stick{display:none}
dialog{margin:auto;border:0;border-radius:20px;padding:24px;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,50,.55)}
dialog h3{color:var(--navy);margin-bottom:6px}dialog p{color:var(--mut);margin-bottom:14px}
@media(max-width:860px){
 nav{display:none}
 .hero .wrap{grid-template-columns:1fr}
 .grid,.steps{grid-template-columns:1fr}
 .hero{padding-top:32px}
 .hz{width:64px}
 .stick{display:block;position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.95);border-top:1px solid #e3eef7;text-align:center}
 .stick .btn{width:100%}
 body{padding-bottom:78px}
 header .btn.sm{display:none}
}
</style>
</head>
<body>
<header><div class="wrap bar">
 <a class="logo" href="#top"><img src="icon-192.png" alt="">Panic City</a>
 <nav><a href="#features" data-t="nav_features"></a><a href="#video" data-t="nav_video"></a><a href="#install" data-t="nav_install"></a><a href="#faq" data-t="nav_faq"></a></nav>
 <span class="sp"></span>
 <select id="lang" aria-label="Language"></select>
 <a class="btn sm buy" href="#" data-t="cta_buy_short"></a>
</div></header>

<main id="top">
<div class="hero"><div class="wrap">
 <div>
  <span class="kick" data-t="kicker"></span>
  <h1><span data-t="h1a"></span><br><span style="color:var(--navy)" data-t="h1b"></span></h1>
  <p class="lead" data-t="hero_p"></p>
  <div class="chips"><b data-t="b1"></b><b data-t="b2"></b><b data-t="b3"></b><b data-t="b4"></b></div>
  <div class="ctas"><a class="btn buy" href="#" data-t="cta_buy"></a><a class="btn ghost" href="#video" data-t="cta_watch"></a></div>
  <p class="note" data-t="hero_note"></p>
 </div>
 <div class="tablet"><img id="heroShot" src="img/en/home.jpg" alt="Panic City"><img class="hz a" src="img/heroes/lily.webp" alt=""><img class="hz b" src="img/heroes/noah.webp" alt=""></div>
</div></div>

<section id="video"><div class="wrap">
 <h2 data-t="video_h"></h2><p class="sub" data-t="video_p"></p>
 <div class="vid"><video id="tour" controls playsinline preload="none" poster="img/poster-en.jpg"></video></div>
</div></section>

<section id="features" class="gal"><div class="wrap">
 <h2 data-t="feat_h"></h2><p class="sub" data-t="feat_p"></p>
 <div class="grid">
  <div class="card"><div class="em">🎮</div><h3 data-t="f1h"></h3><p data-t="f1p"></p></div>
  <div class="card"><div class="em">🏙️</div><h3 data-t="f2h"></h3><p data-t="f2p"></p></div>
  <div class="card"><div class="em">🎢</div><h3 data-t="f3h"></h3><p data-t="f3p"></p></div>
  <div class="card"><div class="em">🚨</div><h3 data-t="f4h"></h3><p data-t="f4p"></p></div>
  <div class="card"><div class="em">👨‍👩‍👧</div><h3 data-t="f5h"></h3><p data-t="f5p"></p></div>
  <div class="card"><div class="em">🌍</div><h3 data-t="f6h"></h3><p data-t="f6p"></p></div>
 </div>
</div></section>

<section><div class="wrap">
 <h2 data-t="gal_h"></h2><p class="sub">&nbsp;</p>
 <div class="rail" id="rail"></div>
</div></section>

<section class="gal"><div class="wrap">
 <h2 data-t="heroes_h"></h2><p class="sub" data-t="heroes_p"></p>
 <div class="heroes" id="heroes"></div>
</div></section>

<section id="install"><div class="wrap">
 <h2 data-t="how_h"></h2><p class="sub">&nbsp;</p>
 <div class="steps">
  <div class="card"><h3 data-t="s1h"></h3><p data-t="s1p"></p></div>
  <div class="card"><h3 data-t="s2h"></h3><p data-t="s2p"></p></div>
  <div class="card"><h3 data-t="s3h"></h3><p data-t="s3p"></p></div>
 </div>
 <div class="tabs" id="tabs"></div>
 <div class="tabbody"><ol id="tabList"></ol></div>
</div></section>

<section id="faq" class="gal"><div class="wrap">
 <h2 data-t="faq_h"></h2><p class="sub">&nbsp;</p>
 <div id="faqList"></div>
</div></section>

<section class="final"><div class="wrap">
 <h2 data-t="final_h"></h2><p class="sub" data-t="final_p"></p>
 <div class="price" id="price"></div>
 <a class="btn buy" href="#" data-t="cta_buy"></a>
 <p class="note" style="color:#c9d6f5" data-t="hero_note"></p>
</div></section>
</main>
<footer><div class="wrap" data-t="foot"></div></footer>
<div class="stick"><a class="btn buy" href="#" data-t="cta_buy"></a></div>

<dialog id="dlg"><h3 data-t="dlg_h"></h3><p data-t="dlg_p"></p><form method="dialog"><button class="btn sm" data-t="dlg_ok"></button></form></dialog>

<div id="pdlg" style="display:none;position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483000;background:rgba(10,20,50,.6);align-items:center;justify-content:center;padding:16px"><div style="background:#fff;border-radius:22px;padding:24px;max-width:340px;width:100%;box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.35)"><h3 data-t="pass_h" style="margin-bottom:6px;color:#16295c"></h3><p data-t="pass_p" style="color:#5b6b8c;margin-bottom:14px"></p><input id="pin" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="FAM-XXXX-XXXX" style="width:100%;box-sizing:border-box;font:700 17px Poppins,sans-serif;text-align:center;padding:11px;border-radius:12px;border:2px solid #d7e6f2;margin-bottom:12px"><div style="text-align:center"><button class="btn sm" id="pgo" data-t="pass_go"></button></div></div></div>
<script src="i18n.js?v=3"></script>
<script>
/* ===== Réglages à remplir ===== */
var BUY_URL='https://buy.stripe.com/9B68wRamP3fH6Oq4In0sU00';            // lien de paiement Stripe (Payment Link) à 4,99 $
var SUPPORT_EMAIL='';      // optionnel
/* ============================== */
var I=window.PC_I18N,L='en',IDX=0;
var SHOTS=['home','city','park','alert','arcade','motus'],CAPS=['c1','c2','c3','c4','c5','c6'];
var HEROES=['lily','noah','anaya','hezekia','ariana','blocky','bolt','drako','choco','elias','eva','soraya'];
function pick(){
  try{var s=localStorage.getItem('pc_lang');if(s&&I[s])return s}catch(e){}
  var n=(navigator.language||'en').toLowerCase().slice(0,2);
  return I[n]?n:'en';
}
function t(k){var d=I[L];return (d[k]!=null?d[k]:I.en[k]).toString().replace(/\{p\}/g,I[L].price)}
function set(l){
  L=l;try{localStorage.setItem('pc_lang',l)}catch(e){}
  var d=I[l];
  document.documentElement.lang=d.lang;document.title=d.title;
  document.querySelector('meta[name=description]').content=d.desc;
  document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=t(e.dataset.t)});
  document.getElementById('price').textContent=d.price;
  var v=document.getElementById('tour');var was=v.currentSrc&&!v.paused;
  v.pause();v.src='tour-'+l+'.mp4';v.poster='img/poster-'+l+'.jpg';
  document.getElementById('heroShot').src='img/'+l+'/home.jpg';
  document.getElementById('rail').innerHTML=SHOTS.map(function(s,i){return '<figure><img loading="lazy" src="img/'+l+'/'+s+'.jpg" alt=""><figcaption>'+t(CAPS[i])+'</figcaption></figure>'}).join('');
  document.getElementById('faqList').innerHTML=[1,2,3,4,5,6].map(function(i){return '<details><summary>'+t('q'+i)+'</summary><p>'+t('a'+i)+'</p></details>'}).join('');
  var tabs=[['ios','tab_ios'],['android','tab_android'],['pc','tab_pc']];
  var def=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)?'ios':/Android/.test(navigator.userAgent)?'android':'pc';
  window._tab=window._tab||def;
  document.getElementById('tabs').innerHTML=tabs.map(function(x){return '<button data-k="'+x[0]+'"'+(x[0]===window._tab?' class="on"':'')+'>'+t(x[1])+'</button>'}).join('');
  document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){window._tab=b.dataset.k;set(L);}});
  document.getElementById('tabList').innerHTML=d[window._tab].map(function(s){return '<li>'+s+'</li>'}).join('');
  document.getElementById('lang').value=l;
}
(function init(){
  var sel=document.getElementById('lang');
  sel.innerHTML=Object.keys(I).map(function(k){return '<option value="'+k+'">'+I[k].flag+' '+I[k].name+'</option>'}).join('');
  sel.onchange=function(){set(sel.value)};
  document.getElementById('heroes').innerHTML=HEROES.map(function(h){return '<img loading="lazy" src="img/heroes/'+h+'.webp" alt="">'}).join('');
  var p=new URLSearchParams(location.search).get('lang');
  set(p&&I[p]?p:pick());
  document.querySelectorAll('.buy').forEach(function(a){a.addEventListener('click',function(e){
    e.preventDefault();
    if(BUY_URL){location.href=BUY_URL}else{document.getElementById('dlg').showModal()}
  })});
})();

/* 5 appuis sur le logo en haut à gauche : saisie d'un pass famille */
(function(){var n=0,t=null,lg=document.querySelector('.logo'),pd=document.getElementById('pdlg');if(!lg||!pd)return;var last=0;
function tap(e){var now=Date.now();if(now-last<120)return;last=now;n++;clearTimeout(t);t=setTimeout(function(){n=0},10000);if(n>=5){n=0;pd.style.display='flex';setTimeout(function(){try{document.getElementById('pin').focus()}catch(x){}},80)}}
lg.addEventListener('pointerup',tap);lg.addEventListener('touchend',tap);lg.addEventListener('click',function(e){e.preventDefault();tap(e)});
function go(){var v=document.getElementById('pin').value.trim();if(v)location.href='play/index.html?pass='+encodeURIComponent(v)}
document.getElementById('pgo').onclick=go;document.getElementById('pin').onkeydown=function(e){if(e.key==='Enter')go()};
pd.addEventListener('click',function(e){if(e.target===pd)pd.style.display='none'})})();
</script>
</body>
</html>
